<style>
/* VOICE: calm, practical store companion – trustworthy, no hype
   IDEA: a shelf-side scanner that sorts groceries like a traffic light
   PICTURE: the working app itself, in a phone, with the camera frame as hero
   COLOUR and TYPE: near-black ground, green/yellow/red/grey signals, purple heart; Space Grotesk
   LAYOUT: one phone column; full screen on phones, centred device on wider screens */
:root{color-scheme:dark;--bg:#0E1012;--card:#15181B;--card2:#1B1F23;--line:#23272B;--line2:#2E3337;--ink:#F2F3F4;--mute:#9AA1A8;--soft:#C9CDD2;--acc:#7CFFB2;
--lav:#5CE29A;--lavt:#7BE8AE;--lavb:rgba(92,226,154,.12);--mid:#FFD166;--midb:rgba(255,209,102,.13);--hoy:#FF6B5E;--hoyt:#FF8A7F;--hoyb:rgba(255,107,94,.16);--gra:#9AA1A8;--grat:#C9CDD2;--grab:rgba(154,161,168,.16);--pur:#C7A8FF;--purb:rgba(183,148,255,.16)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:#07080A;color:var(--ink);font:16px/1.45 "Space Grotesk",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:#C9F7DC}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 70px));background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1a1c1f,0 30px 80px rgba(0,0,0,.6)}
.note{font-size:13px;color:#8a9097;text-align:center;max-width:390px;margin:0}
@media(max-width:520px){.stage{padding:0;gap:0}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}.note{display:none}}
#view{position:absolute;inset:0;overflow-y:auto;padding:52px 20px 130px}
#view::-webkit-scrollbar{display:none}
h1{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.lbl{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}
.grow{flex:1 1 auto}.sb{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink)}
.icb{width:44px;height:44px;border-radius:14px;border:1px solid #2A2E33;background:#16191C;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chip{height:36px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
.chip.on{background:var(--ink);color:#0E1012;border-color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;margin-right:-20px;padding-right:20px}.hs::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.tab{height:40px;border-radius:12px;border:0;background:none;color:var(--soft);font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);color:#0E1012;font-weight:700}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid #3A4046}
.search input{border:0;outline:0;background:none;font-size:16px;flex:1}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.tag{font-size:12px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.ing{padding:5px 10px;border-radius:9px;font-size:13px;font-weight:600;border:0;cursor:pointer}
.heart{width:24px;height:24px;border-radius:12px;background:var(--purb);color:var(--pur);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.img{border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#6B5F5B}
.sub{font-size:12px;color:var(--mute)}
.brand{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mute)}
.big{width:100%;height:50px;border-radius:16px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.big.light{background:var(--ink);color:#0E1012}.big.ghost{background:none;border:1px solid var(--line2);color:var(--ink)}
.sw{width:52px;height:32px;border-radius:16px;border:0;padding:3px;display:flex;cursor:pointer;flex-shrink:0;background:#2E3337;justify-content:flex-start}
.sw span{width:26px;height:26px;border-radius:13px;background:#C9CDD2}
.sw.on{background:var(--acc);justify-content:flex-end}.sw.on span{background:#0E1012}
.sw.pur.on{background:#B794FF}
.empty{padding:22px;text-align:center;color:var(--mute);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding-right:10px;background:none;border:0;color:#C9F7DC;font-size:15px;font-weight:600;cursor:pointer;align-self:flex-start}
nav.bar{position:absolute;left:20px;right:20px;bottom:24px;height:68px;border-radius:24px;background:#16191C;border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}
nav.bar button{width:48px;height:48px;border-radius:16px;border:0;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer}
nav.bar button.on{background:#23272B;color:var(--ink)}
nav.bar button.scan{width:88px;height:88px;border-radius:30px;background:var(--acc);color:#0E1012;margin-top:-46px;box-shadow:0 0 0 6px var(--bg)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:#15181B;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 20px 30px;display:flex;flex-direction:column;gap:10px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:9}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#0E1012;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.show{opacity:1}
.cam{position:relative;height:330px;border-radius:26px;background:#181B1F;overflow:hidden;display:flex;align-items:center;justify-content:center}
.corner{position:absolute;width:42px;height:42px;border:4px solid var(--acc)}
.scanline{position:absolute;left:46px;right:46px;top:50%;height:3px;border-radius:2px;background:var(--acc);animation:sl 2.2s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateY(-60px)}50%{transform:translateY(60px)}}
@media(prefers-reduced-motion:reduce){.scanline{animation:none}}
textarea{width:100%;min-height:150px;border-radius:16px;background:#EDE9E3;color:#2A2622;border:0;padding:14px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.step{display:flex;gap:12px}.num{width:28px;height:28px;border-radius:14px;background:#23272B;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
/* ---- phone app ---- */
html,body{background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
.stage{position:fixed!important;top:0;right:0;bottom:0;left:0;padding:0!important;gap:0!important;display:block!important;min-height:0!important}
.phone{position:absolute!important;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%!important;max-width:600px;height:auto!important;border-radius:0!important;box-shadow:none!important}
#view{padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:calc(env(safe-area-inset-bottom) + 112px)}
nav.bar{left:0;right:0;bottom:0;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-radius:24px 24px 0 0;border-left:0;border-right:0;border-bottom:0}
.img{position:relative}
.pimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cammsg{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;background:rgba(14,16,18,.85);font-size:14px;font-weight:600;white-space:nowrap}
.icb.on{background:var(--acc);color:#0E1012;border-color:var(--acc)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--acc);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.updbar{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 8px);z-index:20;padding:12px 14px;border-radius:16px;border:0;background:var(--acc);color:#0E1012;font-weight:700;cursor:pointer}
input,textarea{font-size:16px}
</style>
</head>

/* ---------- rating engine ---------- */
const SEV = {"Lav":0,"Middels":1,"Ikke vurdert":2,"Høy":3};
const COL = {"Lav":["var(--lav)","var(--lavt)","var(--lavb)"],"Middels":["var(--mid)","var(--mid)","var(--midb)"],"Høy":["var(--hoy)","var(--hoyt)","var(--hoyb)"],"Ikke vurdert":["var(--gra)","var(--grat)","var(--grab)"]};
const worst = a => a.reduce((w,r)=> SEV[r]>SEV[w]?r:w, "Lav");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byName = {}; ROWS.forEach(r=>byName[r.n]=r);
const TERMS = [];
ROWS.forEach(r=>{[r.n,...r.s].forEach(t=>{const k=t.toLowerCase().trim(); if(k) TERMS.push({t:k,r});});});
TERMS.sort((a,b)=>b.t.length-a.t.length);
const WC = /[a-z0-9æøåéèäöüàá]/;
const norm = s => s.toLowerCase().replace(/\s+-\s+/g,"").replace(/\be\s+(\d{3,4}[a-z]?)\b/g,"e$1").replace(/\s+/g," ").trim();
function groupsOf(f){const g=[];const l=f.toLowerCase();if(l.includes("fruktan"))g.push("Fruktaner");if(l.includes("laktose"))g.push("Laktose");if(l.includes("fruktose"))g.push("Fruktose");if(l.includes("polyol"))g.push("Polyoler");if(f.includes("GOS"))g.push("GOS");return g;}
function eff(row){let r=row.r;if(r==="Lav"||r==="Ikke vurdert")return r;const g=groupsOf(row.f);if(g.length&&!g.some(x=>S.triggers[x]))return "Lav";if(S.strict&&r==="Middels")return "Høy";return r;}
function match(name,lf){
  let s=" "+norm(name)+" "; const found=[];
  for(const {t,r} of TERMS){
    let i=s.indexOf(t);
    while(i>-1){
      if(!WC.test(s[i-1]||" ")&&!WC.test(s[i+t.length]||" ")){ if(!found.includes(r))found.push(r); s=s.slice(0,i)+" ".repeat(t.length)+s.slice(i+t.length); }
      i=s.indexOf(t,i+1);
    }
  }
  if(!found.length&&/\be\d{3,4}[a-z]?\b/.test(s)) found.push(byName["andre E-nummer"]);
  const l=name.toLowerCase();
  if(lf||/laktosefri|laktoseredusert/.test(l)) return found.map(r=> (r.f==="Laktose"&&r.c==="Melk og meieri")?byName["laktosefrie meieriprodukter"]:r);
  return found;
}
function parse(str){
  let s=str.replace(/^\s*ingredienser\s*:/i,"");
  const cut=s.search(/kan inneholde spor/i); if(cut>-1)s=s.slice(0,cut);
  {let d=0;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==="(")d++;else if(ch===")")d--;else if(ch==="."&&d===0&&/^\.\s+[A-ZÆØÅ]/.test(s.slice(i,i+3))){s=s.slice(0,i);break;}}}
  s=s.replace(/\.\s*$/,"");
  const out=[];let depth=0,buf="";
  const push=()=>{const t=buf.trim();buf="";if(!t)return; if(/^[\d.,\s]*%?$/.test(t)){ if(out.length&&/%/.test(t)&&!out[out.length-1].pct) out[out.length-1].pct=t.replace(/\s/g,""); return; } out.push(node(t));};
  for(let i=0;i<s.length;i++){ const ch=s[i];
    if(ch==="("){depth++;buf+=ch;}else if(ch===")"){depth--;buf+=ch;}
    else if(ch===","&&/\d/.test(s[i-1]||"")&&/\d/.test(s[i+1]||"")) buf+=ch;
    else if((ch===","||ch===";")&&depth===0)push(); else buf+=ch;
  }
  push(); return out;
}
function node(t){
  let name="",kids=[],depth=0,inner="",pct="";
  for(const ch of t){
    if(ch==="("){ if(depth>0)inner+=ch; depth++; }
    else if(ch===")"){ depth--; if(depth>0)inner+=ch; else { const k=inner.trim(); if(/^[\d.,\s]+%$/.test(k))pct=k.replace(/\s/g,""); else kids.push(...parse(k)); inner=""; } }
    else if(depth>0) inner+=ch; else name+=ch;
  }
  name=name.trim();
  return {name, pct, kids};
}
function rate(n,lf){
  n.kids.forEach(k=>rate(k,lf));
  const rows=match(n.name,lf); n.rows=rows;
  const own=rows.length?worst(rows.map(eff)):null;
  const generic=rows.length&&rows.every(r=>r.r==="Ikke vurdert");
  if(n.kids.length){
    const kr=n.kids.map(k=>k.rating);
    if(own!==null&&!generic) n.rating=worst([own,...kr.filter(r=>r==="Høy")]);
    else { n.rating=worst(kr); n.ignoredOwn=true; }
  } else n.rating= own===null?"Ikke vurdert":own;
  n.unknown=!rows.length&&!n.kids.length;
  return n;
}
function analyse(text,lf){
  const tree=parse(text).map(n=>rate(n,lf));
  const why=[];const seen=new Set();
  const walk=n=>{
    if(n.unknown){ if(!seen.has("?"+n.name)){seen.add("?"+n.name);why.push({unknown:n.name});} }
    else if(!n.ignoredOwn) n.rows.forEach(r=>{const e=eff(r); if(e!=="Lav"&&!seen.has(r.n)){seen.add(r.n);why.push({row:r,e,label:n.name});}});
    (!n.ignoredOwn&&n.rows.length? n.kids.filter(k=>k.rating==="Høy") : n.kids).forEach(walk);
  };
  tree.forEach(walk);
  why.sort((a,b)=>SEV[b.e||"Ikke vurdert"]-SEV[a.e||"Ikke vurdert"]);
  const overall=tree.length?worst(tree.map(n=>n.rating)):"Ikke vurdert";
  const counts={"Høy":0,"Middels":0,"Ikke vurdert":0,"Lav":0}; tree.forEach(n=>counts[n.rating]++);
  return {tree,why,overall,counts};
}
const prod = id => PRODUCTS.find(p=>p.id===id);
const isLF = p => !!(p.lf||/laktosefri|laktoseredusert/i.test(p.name||""));
const pRate = p => p.id==="custom"? p.a : analyse(p.ing||"",isLF(p));

function gentleState(a){
  let ja=false, bad=false;
  const walk=n=>{ if(n.unknown){bad=true;return;} if(!n.ignoredOwn) n.rows.forEach(r=>{ if(r.k==="Ja")ja=true; else if(r.k!=="Nøytral")bad=true; }); n.kids.forEach(walk); };
  a.tree.forEach(walk);
  return bad?"Nei":(ja?"Ja":"Nøytral");
}
const pHeart = p => { const a=pRate(p); return a.overall==="Lav" && gentleState(a)==="Ja"; };
function ingK(i){ if(i.p){ const pp=prod(i.p), a=pRate(pp); return a.overall==="Lav"?gentleState(a):"Nei"; } return byName[i.r].k; }
const NO_HEART_CATS = ["Godteri","Kaker","Snacks"];
const rHeart = r => { if(r.noHeart||NO_HEART_CATS.includes(r.cat)||recRating(r)!=="Lav") return false; const ks=r.ing.map(ingK); return ks.every(k=>k!=="Nei") && ks.includes("Ja"); };

      else { food += spiral(46,28).map(([a,b],i)=>`<circle cx="${P.x+a}" cy="${P.y+b}" r="${.35+(i%4)*.18}" fill="${mix(inner, i%3?"#000000":"#FFFFFF", i%3?.12:.35)}" opacity=".7"/>`).join("") + `<path d="M${P.x-18} ${P.y+6} q10 -12 24 -8 t14 10" stroke="${mix(inner,"#FFFFFF",.4)}" stroke-width="1.4" fill="none" opacity=".55"/>`; }
      const rest = toks.filter(t => t !== fillTok);
      const slots = rest.length===1 ? [[0,0,24]] : rest.length===2 ? [[-8,-6,19],[11,10,15]] : [[-10,-9,15],[12,-5,13],[-1,13,13]];
      rest.forEach((t,i) => { const [a,b,s]=slots[Math.min(i,slots.length-1)]; food += draw(t, P.x+a, P.y+b, s); });
    } else {
      // plate or (for baking) a wooden board
      vessel = isBoard
        ? `<rect x="${P.x-48}" y="${P.y-34}" width="96" height="68" rx="9" fill="rgba(0,0,0,.4)" filter="url(#${uid}b)" transform="translate(2.5 3.5)"/><rect x="${P.x-48}" y="${P.y-34}" width="96" height="68" rx="9" fill="${G("#C99560","l")}"/>${[0,1,2,3,4,5,6].map(i=>`<path d="M${P.x-46} ${P.y-28+i*9} q30 ${jit(3)} 60 0 t32 0" stroke="#A9773F" stroke-width=".4" fill="none" opacity=".6"/>`).join("")}<circle cx="${P.x+40}" cy="${P.y-26}" r="2.6" fill="#7A4E2A"/>`
        : `<circle cx="${P.x}" cy="${P.y}" r="40" fill="rgba(0,0,0,.35)" filter="url(#${uid}b)" transform="translate(2.5 3.5)"/><circle cx="${P.x}" cy="${P.y}" r="40" fill="url(#${uid}p)"/><circle cx="${P.x}" cy="${P.y}" r="31" fill="url(#${uid}w)"/><circle cx="${P.x}" cy="${P.y}" r="31" fill="none" stroke="#E6E1D8" stroke-width=".6"/><circle cx="${P.x}" cy="${P.y}" r="38.5" fill="none" stroke="${mix(r.bg,"#000",.15)}" stroke-width=".9" opacity=".7"/>`;
      const mains = toks.filter(t => !TOPS.has(t.split(":")[0])), tops = toks.filter(t => TOPS.has(t.split(":")[0]));
      let main = mains[0], sides = mains.slice(1);
      if(!main){ main = tops.shift(); }
      const ramekins = tops.filter(t => /^(dip|bearnaise)/.test(t)), onTop = tops.filter(t => !/^(dip|bearnaise)/.test(t));
      // side dishes that are really "sides" when the main is a protein
      const L = sides.length===0 ? [[0,0,isBoard?31:28]] : sides.length===1 ? [[-8,-1,21],[18,4,14]] : sides.length===2 ? [[-8,2,20],[16,-12,13],[16,13,13]] : [[-10,2,19],[14,-15,12],[20,5,12],[3,20,11]];
      const [mx,my,ms] = L[0];
      const PROT = /^(chicken|meatballs|fish|whitefish|salmon|steak|fishcakes)/;
      const sauceIdx = onTop.findIndex(t => t.startsWith("sauce")), protSide = sides.findIndex(t => PROT.test(t));
      if(sauceIdx > -1 && protSide > -1 && !PROT.test(main)){ const [a,b,s2] = L[protSide+1]; L[protSide+1] = [a,b,s2*1.25]; food += `<g transform="translate(${P.x+a} ${P.y+b}) scale(1.9) translate(${-(P.x+a)} ${-(P.y+b)})">${draw("sauce", P.x+a, P.y+b, s2)}</g>`; onTop.splice(sauceIdx,1); }
      food += draw(main, P.x+mx, P.y+my, ms);
      sides.forEach((t,i) => { const [a,b,s] = L[i+1]; food += draw(t, P.x+a, P.y+b, s*(PROT.test(t)&&sauceIdx>-1?.8:1)); });
      const tSlots = [[0,0],[-.25,.3],[.3,-.25],[.2,.35]];
      onTop.forEach((t,i) => { const [a,b] = tSlots[i%4]; const k = t.split(":")[0];
        const big = ["greens","cucumber","egg","feta","banana","kiwi","peanuts","caramels"].includes(k) && !sides.length;
        const sc = {sauce:1,cheese:.8,berries:.8,herbs:.65,seeds:.8,cinnamon:.9,butter:.7}[k] || .6;
        top += big ? draw(t, P.x+mx+(i?ms*.45:ms*.4)*(i%2?-1:1), P.y+my+ms*.45*(i%2?1:-1), ms*.5) : draw(t, P.x+mx+a*ms*.6, P.y+my+b*ms*.6, ms*sc); });
      ramekins.forEach((t,i) => { top += draw(t, P.x+32-i*10, P.y+24, 8); });
    }
    return scene(r, uid, defs.join(""), vessel, food, top, kind);
  }
  /* ---- table, props and light ---- */
  const SURF = {Frokost:"oak",Bakst:"oak",Middag:"walnut",Lunsj:"linen",Mellommåltid:"linen",Snacks:"slate",Godteri:"slate",Kaker:"marble"};
  function table(t,uid,R){
    let o="";
    if(t==="oak"||t==="walnut"){
      const [c1,c2,c3] = t==="oak"? ["#C9A27A","#BC946B","#D4AE86"] : ["#6B4430","#5E3A27","#77503A"];
      o+=`<rect width="160" height="100" fill="${c1}"/>`;
      for(let y=0;y<100;y+=20){ o+=`<rect y="${y}" width="160" height="20" fill="${R()<.5?c2:c3}" opacity=".55"/><path d="M0 ${y}H160" stroke="rgba(0,0,0,.2)" stroke-width=".7"/>`; for(let k=0;k<3;k++){ const yy=y+3+R()*14; o+=`<path d="M0 ${yy} C40 ${yy+R()*3-1.5} 80 ${yy+R()*3-1.5} 160 ${yy}" stroke="rgba(0,0,0,.09)" stroke-width=".5" fill="none"/>`; } }
    } else if(t==="linen"){
      o+=`<rect width="160" height="100" fill="#E8E1D4"/><rect width="160" height="100" filter="url(#${uid}n)" opacity=".16"/>`;
      for(let x=0;x<160;x+=2.5) o+=`<path d="M${x} 0V100" stroke="rgba(120,100,80,.05)" stroke-width=".6"/>`;
    } else if(t==="slate"){
      o+=`<rect width="160" height="100" fill="#30353B"/><rect width="160" height="100" filter="url(#${uid}n)" opacity=".2"/>`;
    } else {
      o+=`<rect width="160" height="100" fill="#EEEBE6"/>`;
      for(let i=0;i<5;i++){ const y=R()*100; o+=`<path d="M-5 ${y} C40 ${y+R()*30-15} 90 ${y+R()*30-15} 165 ${y+R()*20-10}" stroke="rgba(150,150,160,.25)" stroke-width="${.4+R()}" fill="none"/>`; }
    }
    return o;
  }
  function scene(r, uid, gdefs, vessel, food, top, kind){
    const R = rnd(r.id+"s"), t = SURF[r.cat]||"oak";
    const hot = kind==="bowl" && ["Frokost","Lunsj","Middag"].includes(r.cat);
    const napkin = `<g transform="rotate(-8 24 30)" filter="url(#${uid}t)"><rect x="8" y="12" width="26" height="52" rx="2" fill="${r.bg}"/><rect x="8" y="12" width="26" height="52" rx="2" fill="url(#${uid}c)"/><path d="M13 12v52M29 12v52" stroke="rgba(255,255,255,.5)" stroke-width=".7"/></g>`;
    const fork = `<g filter="url(#${uid}t)" transform="rotate(-8 24 30)"><rect x="19.6" y="34" width="2.6" height="34" rx="1.3" fill="#C7CCD1"/><path d="M17.6 18 v9 q0 5 3.3 5.5 q3.3 -.5 3.3 -5.5 v-9" fill="#C7CCD1"/><path d="M19.3 18v8M20.9 18v8M22.5 18v8" stroke="#9AA0A6" stroke-width=".4"/></g>`;
    const knife = `<g filter="url(#${uid}t)"><rect x="135" y="40" width="3" height="30" rx="1.5" fill="#B5BAC0"/><path d="M135 41 L135 18 Q139.5 20 138 41z" fill="#D6DADF"/></g>`;
    const spoon = `<g filter="url(#${uid}t)"><ellipse cx="137" cy="28" rx="4.4" ry="6.4" fill="#C7CCD1"/><ellipse cx="136.2" cy="27" rx="2.4" ry="4" fill="#E2E5E8"/><rect x="135.8" y="33" width="2.4" height="38" rx="1.2" fill="#C7CCD1"/></g>`;
    const props = kind==="glass" ? `<circle cx="80" cy="50" r="31" fill="${mix(r.bg,"#FFFFFF",.2)}" opacity=".9"/>` : kind==="bowl" ? napkin+spoon : r.cat==="Bakst"||r.cat==="Kaker"||r.cat==="Godteri"||r.cat==="Snacks"||r.cat==="Mellommåltid" ? napkin : napkin+fork+knife;
    const steam = hot? [66,80,94].map((x,i)=>`<path d="M${x} ${26-i%2*4} q-4 -6 0 -11 t0 -11" stroke="rgba(255,255,255,.6)" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#${uid}b2)"/>`).join("") : "";
    return `<svg viewBox="18 3 124 94" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>${gdefs}
<radialGradient id="${uid}p" cx=".38" cy=".33" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#F5F2ED"/><stop offset="1" stop-color="#DCD6CC"/></radialGradient>
<radialGradient id="${uid}w" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECE8E1"/></radialGradient>
<linearGradient id="${uid}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".25"/><stop offset="1" stop-color="#000000" stop-opacity=".15"/></linearGradient>
<radialGradient id="${uid}l" cx=".2" cy=".1" r=".95"><stop offset="0" stop-color="#FFF6E5" stop-opacity=".45"/><stop offset=".6" stop-color="#FFF6E5" stop-opacity="0"/></radialGradient>
<radialGradient id="${uid}v" cx=".5" cy=".5" r=".72"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".42"/></radialGradient>
<filter id="${uid}b" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.6"/></filter>
<filter id="${uid}b2"><feGaussianBlur stdDeviation="1"/></filter>
<filter id="${uid}s" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx=".6" dy=".9" stdDeviation=".6" flood-color="#2A1A0A" flood-opacity=".4"/></filter>
<filter id="${uid}t" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="1.2" dy="1.6" stdDeviation="1.1" flood-opacity=".35"/></filter>
<filter id="${uid}n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix type="saturate" values="0"/></filter>
</defs>${table(t,uid,R)}${props}${vessel}${food}${top}${steam}<rect width="160" height="100" fill="url(#${uid}l)"/><rect width="160" height="100" fill="url(#${uid}v)"/></svg>`;
  }
  return {pack, dish};
})();

function go(view,push=true){ if(push&&S.view!==view) S.stack.push({view:S.view,pid:S.pid,rid:S.rid,row:S.row}); S.view=view; S.clearArm=false; render(); }
function back(){ const p=S.stack.pop(); if(!p){go("historikk",false);return;} Object.assign(S,p); render(); }
function addHistory(pid){ S.history=S.history.filter(h=>!(h.pid===pid&&h.day==="I dag")); const d=new Date(); S.history.unshift({pid,ts:Date.now(),day:"I dag",time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}); }

const app=document.getElementById("app");
app.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el||el.disabled) return;
  const a=el.dataset.act, g=el.dataset.arg;
  switch(a){
    case "tab": S.stack=[]; S.sheet=null; go(g,false); break;
    case "go": go(g); break;
    case "back": back(); break;
    case "openP": S.pid=g; go("vare"); break;
    case "openCustom": S.pid="custom"; go("vare"); break;
    case "openR": S.rid=g; go("opp"); break;
    case "openRow": S.row=g; go("row"); break;
    case "histF": S.histF=g; render(true); break;
    case "lookTab": S.lookTab=g; render(true); break;
    case "lookF": S.lookFilter=g; document.getElementById("lookOut").innerHTML=lookOut(); break;
    case "recCat": S.recCat=g; render(true); break;
    case "saveP": { const i=S.saved.p.indexOf(g); if(i>-1){S.saved.p.splice(i,1);toast("Fjernet fra lagret");} else {S.saved.p.unshift(g);toast("Lagret");} render(true); break; }
    case "saveR": { const i=S.saved.r.indexOf(g); if(i>-1){S.saved.r.splice(i,1);toast("Fjernet fra lagret");} else {S.saved.r.unshift(g);toast("Lagret");} render(true); break; }
    case "trig": S.triggers[g]=!S.triggers[g]; render(true); break;
    case "sw": S[g]=!S[g]; render(true); break;
    case "clear": if(S.clearArm){S.history=[];S.clearArm=false;toast("Historikken er tømt");render(true);} else {S.clearArm=true;render(true);} break;
    case "sheet": S.sheet=g; render(true); break;
    case "closeSheet": S.sheet=null; render(true); break;
    case "doScanDemo": S.sheet=null; S.inputBar=""; if(g==="ukjent"){go("ingendata");} else {addHistory(g); S.pid=g; go("vare");} break;
    case "useLes": useLes(); break;
    case "torch": toggleTorch(); break;
    case "retryCam": stopCam(); document.getElementById("camErr").innerHTML=""; startCam(); break;
    case "doLookup": lookup(g); break;
    case "update": checkUpdate(true); break;
    case "toast": toast(g); break;
  }
});

const F = "code,product_name,product_name_no,product_name_nb,product_name_nn,generic_name,brands,quantity,ingredients_text,ingredients_text_no,ingredients_text_nb,ingredients_text_nn,ingredients_text_sv,ingredients_text_da,ingredients_text_en,image_front_small_url,image_front_url,categories_tags,categories,lang";

/* ---------- storage ---------- */
function persist() {
  try {
    localStorage.setItem(LS, JSON.stringify({ history: S.history.slice(0, 300), saved: S.saved, triggers: S.triggers, strict: S.strict, kassal: S.kassal, kassalKey: S.kassalKey, custom: S.custom && { ...S.custom, a: null } }));
  } catch (e) {}
}
function saveProd(p) {
  const i = PRODUCTS.findIndex(x => x.id === p.id);
  if (i > -1) PRODUCTS[i] = p; else PRODUCTS.push(p);
  try {
    const own = PRODUCTS.filter(x => !SEED_IDS.has(x.id) && !x.tmp).slice(-400);
    localStorage.setItem(LSP, JSON.stringify(own));
  } catch (e) {}
}
function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem(LS) || "null");
    if (d) { Object.assign(S, d); S.triggers = { ...{ Fruktaner: true, Laktose: true, Fruktose: true, Polyoler: true, GOS: true }, ...(d.triggers || {}) }; }
    S.skanSom = true;
    if (S.custom) S.custom.a = analyse(S.custom.ing);
    JSON.parse(localStorage.getItem(LSP) || "[]").forEach(p => { const i = PRODUCTS.findIndex(x => x.id === p.id); if (i > -1) PRODUCTS[i] = p; else PRODUCTS.push(p); });
  } catch (e) {}
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}
function relabel() {
  const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  S.history.forEach(h => {
    if (!h.ts) return;
    const d = new Date(h.ts), t = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
    const s = d.toLocaleDateString("nb-NO", { weekday: "long", day: "numeric", month: "long" });
    h.day = t === d0 ? "I dag" : t === d0 - 864e5 ? "I går" : s[0].toUpperCase() + s.slice(1);
    h.time = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  });
}

/* ---------- Open Food Facts / Kassalapp ---------- */
const clean = s => String(s || "").replace(/_/g, "").replace(/\s+/g, " ").trim();
function fromOFF(o, ean) {
  ean = ean || o.code;
  const name = clean(o.product_name_no || o.product_name_nb || o.product_name_nn || o.product_name || o.generic_name || "");
  let ing = o.ingredients_text_no || o.ingredients_text_nb || o.ingredients_text_nn || "", langNote = "";
  if (!ing) {
    const other = [["sv", "svensk"], ["da", "dansk"], ["en", "engelsk"]].find(([l]) => o["ingredients_text_" + l]);
    if (o.ingredients_text && (!o.lang || ["no", "nb", "nn"].includes(o.lang))) ing = o.ingredients_text;
    else if (other) { ing = o["ingredients_text_" + other[0]]; langNote = `Ingredienslisten finnes bare på ${other[1]}. Ord appen ikke kjenner blir grå – ta gjerne bilde av den norske lista.`; }
    else if (o.ingredients_text) { ing = o.ingredients_text; langNote = "Ingredienslisten er kanskje ikke på norsk. Ord appen ikke kjenner blir grå."; }
  }
  const cats = (o.categories_tags || []).filter(t => /^en:/.test(t));
  const catName = clean((o.categories || "").split(",").pop() || "");
  return { id: "e" + ean, ean, brand: clean((o.brands || "").split(",")[0]).toUpperCase() || "UKJENT MERKE", name: name || "Ukjent navn", size: clean(o.quantity), cat: catName.toLowerCase(), cats, img: o.image_front_small_url || o.image_front_url || "", src: "Open Food Facts", ing: clean(ing), langNote, pack: "none", c1: "#2A2E33", c2: "#2A2E33" };
}
async function getJSON(url, opt = {}, ms = 9000) {
  const ac = new AbortController(); const t = setTimeout(() => ac.abort(), ms);
  try { const r = await fetch(url, { ...opt, signal: ac.signal }); if (!r.ok) { const e = new Error("http " + r.status); e.status = r.status; throw e; } return await r.json(); }
  finally { clearTimeout(t); }
}
async function fetchOFF(ean) {
  try {
    const j = await getJSON(`${OFF}/api/v2/product/${ean}.json?fields=${F}`);
    return j && j.status === 1 && j.product ? fromOFF(j.product, ean) : null;
  } catch (e) { if (e.status === 404) return null; throw e; }
}
async function fetchKassal(ean) {
  const j = await getJSON(`https://kassal.app/api/v1/products/ean/${ean}`, { headers: { Authorization: "Bearer " + S.kassalKey, Accept: "application/json" } });
  const ps = (j && j.data && j.data.products) || []; const x = ps.find(q => q.ingredients) || ps[0];
  if (!x) return null;
  return { id: "e" + ean, ean, brand: clean(x.brand || x.vendor || "").toUpperCase() || "UKJENT MERKE", name: clean(x.name) || "Ukjent navn", size: x.weight ? x.weight + " " + (x.weight_unit || "") : "", cat: "", cats: [], img: x.image || "", src: "Kassalapp", ing: clean(x.ingredients), langNote: "", pack: "none", c1: "#2A2E33", c2: "#2A2E33" };
}

/* ---------- lookup after a scan ---------- */
async function lookup(raw) {
  const ean = String(raw || "").replace(/\D/g, ""); if (!ean) return;
  stopCam();
  const known = PRODUCTS.find(x => x.ean === ean && x.ing);
  if (known) { addHistory(known.id); S.pid = known.id; go("vare"); return; }
  S.looking = ean; S.offline = false; S.pendingEan = ean; S.pendingName = ""; S.pendingBrand = ""; S.inputBar = ean;
  go("henter");
  let p = null, failed = false;
  try { p = await fetchOFF(ean); } catch (e) { failed = true; }
  if ((!p || !p.ing) && S.kassal && S.kassalKey) { try { const k = await fetchKassal(ean); if (k && (k.ing || !p)) p = k; } catch (e) {} }
  if (S.view !== "henter" || S.looking !== ean) return;
  if (p && p.ing) { saveProd(p); addHistory(p.id); S.pid = p.id; S.pendingEan = ""; go("vare", false); return; }
  if (p) { S.pendingName = p.name; S.pendingBrand = p.brand; S.pendingImg = p.img; }
  S.offline = failed && !p;
  go("ingendata", false);
}

/* ---------- "Prøv heller": green alternatives from Open Food Facts ---------- */
function altsHtml(p) {
  const local = PRODUCTS.filter(x => x.cat && x.cat === p.cat && x.id !== p.id && x.ing && pRate(x).overall === "Lav");
  const remote = ALTS[p.id];
  if (remote === undefined && p.cats && p.cats.length) loadAlts(p);
  const list = [...local, ...(remote || []).filter(x => !local.some(l => l.id === x.id))].slice(0, 5);
  if (list.length) return list.map(x => prodRow(x)).join("");
  if (remote === undefined && p.cats && p.cats.length) return `<span class="sub">Leter etter grønne varer i samme kategori …</span>`;
  return `<span class="sub" style="line-height:1.4">Fant ingen grønne varer i samme kategori i Open Food Facts ennå.</span>`;
}
async function loadAlts(p) {
  ALTS[p.id] = null; const found = [];
  const tags = p.cats.slice().reverse().slice(0, 3);
  for (const tag of tags) {
    try {
      const j = await getJSON(`${OFF}/api/v2/search?categories_tags=${encodeURIComponent(tag)}&countries_tags=en:norway&fields=${F}&page_size=60`, {}, 12000);
      (j.products || []).map(o => fromOFF(o)).filter(x => x.ean && x.ing && !x.langNote && x.ean !== p.ean && !found.some(f => f.ean === x.ean)).forEach(x => { if (pRate(x).overall === "Lav") found.push(x); });
    } catch (e) { break; }
    if (found.length >= 3) break;
  }
  found.forEach(x => { x.tmp = true; if (!PRODUCTS.some(q => q.id === x.id)) PRODUCTS.push(x); });
  ALTS[p.id] = found.slice(0, 5);
  const el = document.getElementById("altsOut");
  if (el && S.view === "vare" && S.pid === p.id) el.innerHTML = altsHtml(p);
}

/* ---------- name search in Open Food Facts ---------- */
let offT = 0;
function offSearchSoon() {
  clearTimeout(offT);
  const q = S.lookQ.trim().toLowerCase();
  if (q.length < 3) return;
  offT = setTimeout(async () => {
    if (S.offDone[q]) return;
    S.offBusy = true; refreshLook();
    try {
      const j = await getJSON(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&fields=${F}&tagtype_0=countries&tag_contains_0=contains&tag_0=norway`, {}, 12000);
      (j.products || []).map(o => fromOFF(o)).filter(x => x.ean && x.ing).forEach(x => { if (!PRODUCTS.some(p => p.id === x.id)) { x.tmp = true; PRODUCTS.push(x); } const p = PRODUCTS.find(p => p.id === x.id); p.sq = (p.sq || []).concat(q); });
      S.offDone[q] = true;
    } catch (e) { S.offErr = true; }
    S.offBusy = false; refreshLook();
  }, 650);
}

function camError(e) {

}
async function startCam() {
  const v = document.getElementById("camV"); if (!v) return;
  CAM.busy = false;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw Object.assign(new Error("no media"), { name: window.isSecureContext ? "NotFoundError" : "Insecure" });
    if (!CAM.stream || !CAM.stream.active) {
      CAM.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      CAM.track = CAM.stream.getVideoTracks()[0];
      try { await CAM.track.applyConstraints({ advanced: [{ focusMode: "continuous" }] }); } catch (e) {}
    }
    if (S.view !== "skanner" || S.sheet || !document.body.contains(v)) return;
    v.srcObject = CAM.stream; await v.play().catch(() => {});
    camMsg("Hold strekkoden inne i rammen");
    scanLoop(v);
  } catch (e) { camError(e); }
}
function stopCam() {
  clearInterval(CAM.timer); CAM.timer = 0;
  if (CAM.stream) CAM.stream.getTracks().forEach(t => t.stop());
  CAM.stream = null; CAM.track = null; CAM.torch = false;
}
function scanLoop(v) {
  clearInterval(CAM.timer);
  if (!window.ZXing) { camMsg("Strekkodeleseren lastet ikke"); return; }
  if (!CAM.reader) {
    const Z = window.ZXing, hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    CAM.reader = new Z.MultiFormatReader(); CAM.reader.setHints(hints);
  }
  const c = document.createElement("canvas"), ctx = c.getContext("2d", { willReadFrequently: true });
  CAM.timer = setInterval(() => {
    if (CAM.busy || !v.videoWidth) return;
    if (!document.body.contains(v)) { clearInterval(CAM.timer); return; }
    const vw = v.videoWidth, vh = v.videoHeight, cw = Math.round(vw * .86), ch = Math.round(vh * .5);
    const sc = Math.min(1, 1280 / cw); c.width = Math.round(cw * sc); c.height = Math.round(ch * sc);
    ctx.drawImage(v, (vw - cw) / 2, (vh - ch) / 2, cw, ch, 0, 0, c.width, c.height);
    try {
      const Z = window.ZXing;
      const res = CAM.reader.decodeWithState(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))));
      if (res && res.getText()) { CAM.busy = true; clearInterval(CAM.timer); if (navigator.vibrate) navigator.vibrate(40); lookup(res.getText()); }
    } catch (e) { /* no code in this frame */ }
  }, 160);
}
async function toggleTorch() {
  const t = CAM.track;
  try {
    if (!t) throw 0;
    const cap = t.getCapabilities ? t.getCapabilities() : {};
    if (cap.torch === false || (cap.torch === undefined && !/iPhone|iPad/.test(navigator.userAgent))) throw 0;
    CAM.torch = !CAM.torch; await t.applyConstraints({ advanced: [{ torch: CAM.torch }] });
    const b = document.querySelector('[data-act="torch"]'); if (b) { b.classList.toggle("on", CAM.torch); b.setAttribute("aria-pressed", CAM.torch); }
  } catch (e) { CAM.torch = false; toast("Lommelykten støttes ikke her – bruk den i Kontrollsenter"); }
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) stopCam();
  else { if (S.view === "skanner" && !S.sheet) startCam(); checkUpdate(false); }
});

/* ---------- read the ingredient list from a photo (OCR) ---------- */
V.les = () => {
  const a = analyse(S.lesText);
  return `<div class="col g14"><div class="row g10"><button class="icb" aria-label="Tilbake" data-act="back">${I.back}</button><h1>Les ingredienser</h1></div>
  ${S.pendingName ? `<span class="sub" style="font-size:14px">For: <b style="color:var(--ink)">${esc(S.pendingName)}</b></span>` : ""}
  <label class="row g14" style="padding:16px;border-radius:22px;background:var(--acc);color:#0E1012;cursor:pointer"><span class="img" style="width:48px;height:48px;border-radius:16px;background:rgba(14,16,18,.12);color:#0E1012">${I.photo}</span><span class="col g4"><span style="font-size:17px;font-weight:700">Ta bilde av ingredienslisten</span><span style="font-size:13px;font-weight:500">Hold telefonen rett over teksten, god belysning</span></span><input type="file" id="ocrFile" accept="image/*" capture="environment" style="position:absolute;width:1px;height:1px;opacity:0"></label>
  <span class="sub" id="ocrStatus" style="line-height:1.4">${esc(S.ocrStatus || "")}</span>
  <label class="col g6"><span class="lbl">Ingrediensliste</span><textarea id="lesText" placeholder="Teksten fra bildet kommer her. Du kan også skrive eller lime inn.">${esc(S.lesText)}</textarea></label>
  <span class="sub" style="line-height:1.4">Sjekk at teksten stemmer med pakken og rett opp feil før du trykker «Bruk disse».</span>
  <div id="lesOut">${lesOut(a)}</div></div>`;
};
let tessP = null;
function loadTesseract() {
  if (window.Tesseract) return Promise.resolve();
  return tessP || (tessP = new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; s.onload = ok; s.onerror = () => { tessP = null; no(new Error("load")); }; document.head.appendChild(s); }));
}
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, 2200 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  const x = c.getContext("2d"); x.filter = "grayscale(1) contrast(1.35)"; x.drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
function tidyOcr(t) {
  let s = t.replace(/-\s*\n\s*/g, "").replace(/\s*\n\s*/g, " ").replace(/\s{2,}/g, " ");
  const m = s.match(/ingredienser\s*[:;.]?/i); if (m) s = s.slice(m.index + m[0].length);
  const end = s.search(/(næringsinnhold|næringsdeklarasjon|næringsverdi|oppbevar|best før|holdbarhet|netto(vekt)?|produsert (av|for)|energi\s*\d)/i);
  if (end > 20) s = s.slice(0, end);
  return s.trim().replace(/[.;,\s]+$/, ".");
}
function ocrStatus(t) { S.ocrStatus = t; const el = document.getElementById("ocrStatus"); if (el) el.textContent = t; }
async function runOcr(file) {
  if (!file) return;
  try {
    ocrStatus("Laster tekstleseren (første gang tar det litt tid) …");
    await loadTesseract();
    const img = await shrink(file);
    const w = await Tesseract.createWorker("nor", 1, { logger: m => { if (m.status === "recognizing text") ocrStatus("Leser teksten … " + Math.round(m.progress * 100) + " %"); } });
    const { data } = await w.recognize(img);
    await w.terminate();
    const txt = tidyOcr(data.text || "");
    if (!txt) { ocrStatus("Fant ingen tekst. Prøv igjen med bedre lys og telefonen rett over teksten."); return; }
    S.lesText = txt; ocrStatus("Ferdig – sjekk teksten under.");
    if (S.view === "les") render(true);
  } catch (e) { ocrStatus("Klarte ikke å lese bildet" + (navigator.onLine ? "." : " – tekstleseren trenger nett første gang.") + " Du kan skrive inn lista i stedet."); }
}
function useLes() {
  const txt = S.lesText.trim(), ar = analyse(txt);
  if (!ar.tree.length) { toast("Ta bilde av eller skriv inn en ingrediensliste først"); return; }
  if (S.pendingEan) {
    const ean = S.pendingEan;
    const p = { id: "e" + ean, ean, brand: S.pendingBrand || "DITT BILDE", name: S.pendingName || "Vare " + ean, size: "", cat: "", cats: [], img: S.pendingImg || "", src: "Ditt bilde av ingredienslisten", ing: txt, own: true, pack: "none", c1: "#2A2E33", c2: "#2A2E33" };
    saveProd(p); addHistory(p.id); S.pid = p.id; S.pendingEan = ""; S.pendingName = ""; S.lesText = ""; S.ocrStatus = "";
    S.stack = [{ view: "skanner" }]; go("vare", false); return;
  }
  S.custom = { id: "custom", brand: "FRA DITT BILDE", name: "Din vare", size: ar.tree.length + " ingredienser lest", ean: "", cat: "", src: "Ditt bilde av ingredienslisten", ing: txt, a: ar };
  S.history = S.history.filter(h => h.pid !== "custom"); addHistory("custom"); S.pid = "custom"; go("vare");
}
app.addEventListener("change", ev => { if (ev.target.id === "ocrFile") runOcr(ev.target.files && ev.target.files[0]); });

/* ---------- updates ---------- */
async function checkUpdate(manual) {
  try {
    const j = await getJSON("version.json?t=" + Date.now(), { cache: "no-store" }, 5000);
    if (j.version && j.version !== APP_VERSION) {
      if (manual) { toast("Oppdaterer …"); setTimeout(() => location.reload(), 400); }
      else showUpdateBar();
    } else if (manual) toast("Du har nyeste versjon");
  } catch (e) { if (manual) toast("Fikk ikke sjekket – er du på nett?"); }
}
function showUpdateBar() {
  if (document.getElementById("upd")) return;
  const b = document.createElement("button"); b.id = "upd"; b.className = "updbar"; b.textContent = "Ny versjon av Mage – trykk for å oppdatere";
  b.onclick = () => location.reload(); document.getElementById("app").appendChild(b);
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- after every render ---------- */
function afterRender() {
  persist();
  if (S.view === "skanner" && !S.sheet) startCam(); else stopCam();
  if (S.view === "vare") keepProd(S.pid);
}
loadState();

render();
}
</script>
