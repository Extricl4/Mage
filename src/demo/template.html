<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mage – demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, practical store companion – trustworthy, no hype
   IDEA: a shelf-side scanner that sorts groceries like a traffic light
   PICTURE: the working app itself, in a phone, with the camera frame as hero
   COLOUR and TYPE: near-black ground, green/yellow/red/grey signals, purple heart; Space Grotesk
   LAYOUT: one phone column; full screen on phones, centred device on wider screens */
:root{color-scheme:dark;--bg:#0E1012;--card:#15181B;--card2:#1B1F23;--line:#23272B;--line2:#2E3337;--ink:#F2F3F4;--mute:#9AA1A8;--soft:#C9CDD2;--acc:#7CFFB2;
--lav:#5CE29A;--lavt:#7BE8AE;--lavb:rgba(92,226,154,.12);--mid:#FFD166;--midb:rgba(255,209,102,.13);--hoy:#FF6B5E;--hoyt:#FF8A7F;--hoyb:rgba(255,107,94,.16);--gra:#9AA1A8;--grat:#C9CDD2;--grab:rgba(154,161,168,.16);--pur:#C7A8FF;--purb:rgba(183,148,255,.16)}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:#07080A;color:var(--ink);font:16px/1.45 "Space Grotesk",system-ui,sans-serif}
button,input,textarea{font:inherit;color:inherit}
a{color:#C9F7DC}
.stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px}
.phone{position:relative;width:390px;height:min(844px,calc(100vh - 70px));background:var(--bg);border-radius:44px;overflow:hidden;box-shadow:0 0 0 10px #1a1c1f,0 30px 80px rgba(0,0,0,.6)}
.note{font-size:13px;color:#8a9097;text-align:center;max-width:390px;margin:0}
@media(max-width:520px){.stage{padding:0;gap:0}.phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}.note{display:none}}
#view{position:absolute;inset:0;overflow-y:auto;padding:52px 20px 130px}
#view::-webkit-scrollbar{display:none}
h1{margin:0;font-size:26px;font-weight:700;line-height:1.1}
.lbl{font-size:12px;font-weight:600;letter-spacing:2px;color:var(--mute);text-transform:uppercase}
.col{display:flex;flex-direction:column}.row{display:flex;align-items:center}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}
.grow{flex:1 1 auto}.sb{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer;text-decoration:none;color:var(--ink)}
.icb{width:44px;height:44px;border-radius:14px;border:1px solid #2A2E33;background:#16191C;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chip{height:36px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--soft);font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap}
.chip.on{background:var(--ink);color:#0E1012;border-color:var(--ink);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.hs{display:flex;gap:8px;overflow-x:auto;margin-right:-20px;padding-right:20px}.hs::-webkit-scrollbar{display:none}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.tab{height:40px;border-radius:12px;border:0;background:none;color:var(--soft);font-size:14px;font-weight:600;cursor:pointer}
.tab.on{background:var(--ink);color:#0E1012;font-weight:700}
.search{display:flex;align-items:center;gap:10px;height:50px;padding:0 14px;border-radius:16px;background:var(--card);border:1px solid #3A4046}
.search input{border:0;outline:0;background:none;font-size:16px;flex:1}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.tag{font-size:12px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.ing{padding:5px 10px;border-radius:9px;font-size:13px;font-weight:600;border:0;cursor:pointer}
.heart{width:24px;height:24px;border-radius:12px;background:var(--purb);color:var(--pur);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.img{border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#6B5F5B}
.sub{font-size:12px;color:var(--mute)}
.brand{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--mute)}
.big{width:100%;height:50px;border-radius:16px;border:0;font-size:15px;font-weight:700;cursor:pointer}
.big.light{background:var(--ink);color:#0E1012}.big.ghost{background:none;border:1px solid var(--line2);color:var(--ink)}
.sw{width:52px;height:32px;border-radius:16px;border:0;padding:3px;display:flex;cursor:pointer;flex-shrink:0;background:#2E3337;justify-content:flex-start}
.sw span{width:26px;height:26px;border-radius:13px;background:#C9CDD2}
.sw.on{background:var(--acc);justify-content:flex-end}.sw.on span{background:#0E1012}
.sw.pur.on{background:#B794FF}
.empty{padding:22px;text-align:center;color:var(--mute);font-size:14px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;padding-right:10px;background:none;border:0;color:#C9F7DC;font-size:15px;font-weight:600;cursor:pointer;align-self:flex-start}
nav.bar{position:absolute;left:20px;right:20px;bottom:24px;height:68px;border-radius:24px;background:#16191C;border:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;z-index:5}
nav.bar button{width:48px;height:48px;border-radius:16px;border:0;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center;cursor:pointer}
nav.bar button.on{background:#23272B;color:var(--ink)}
nav.bar button.scan{width:88px;height:88px;border-radius:30px;background:var(--acc);color:#0E1012;margin-top:-46px;box-shadow:0 0 0 6px var(--bg)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:10;background:#15181B;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:14px 20px 30px;display:flex;flex-direction:column;gap:10px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:9}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#0E1012;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;white-space:nowrap}
#toast.show{opacity:1}
.cam{position:relative;height:330px;border-radius:26px;background:#181B1F;overflow:hidden;display:flex;align-items:center;justify-content:center}
.corner{position:absolute;width:42px;height:42px;border:4px solid var(--acc)}
.scanline{position:absolute;left:46px;right:46px;top:50%;height:3px;border-radius:2px;background:var(--acc);animation:sl 2.2s ease-in-out infinite}
@keyframes sl{0%,100%{transform:translateY(-60px)}50%{transform:translateY(60px)}}
@media(prefers-reduced-motion:reduce){.scanline{animation:none}}
textarea{width:100%;min-height:150px;border-radius:16px;background:#EDE9E3;color:#2A2622;border:0;padding:14px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.step{display:flex;gap:12px}.num{width:28px;height:28px;border-radius:14px;background:#23272B;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="app">
    <main id="view"></main>
    <nav class="bar" id="nav" aria-label="Hovedmeny"></nav>
    <div id="layer"></div>
    <div id="toast" role="status"></div>
  </div>
  <p class="note">Demo med eksempeldata. Kameraet virker ikke her, så skanning er simulert. Varene, oppskriftene og ingredienslista er ekte – bildene er tegnede illustrasjoner.</p>
</div>
<script>
{
const ROWS = /*__DATA__*/[];
const SHEET_URL = "https://claude.ai/artifact/6AqVWWamcQ16fJXhpsPZqY";

/* ---------- products (real ingredient lists) ---------- */
const PRODUCTS = /*__PRODUCTS__*/[];
const RECIPES = /*__RECIPES__*/[];
const RCATS = ["Alle","Frokost","Lunsj","Middag","Mellommåltid","Snacks","Godteri","Kaker","Bakst"];

/* ---------- state ---------- */
const S = {
 view:"historikk", stack:[], pid:null, rid:null, row:null,
 lookTab:"varer", lookQ:"mel", lookFilter:"alt", recCat:"Alle", recQ:"",
 histQ:"", histF:"alle",
 history:[{pid:"minestrone",day:"I dag",time:"22:41"},{pid:"kvikklunsj",day:"I dag",time:"22:36"},{pid:"tinemelk",day:"I går",time:"18:20"},{pid:"finmix",day:"I går",time:"18:12"}],
 saved:{p:["finmix","tinemelk"], r:["grot","laks"]},
 triggers:{Fruktaner:true,Laktose:true,Fruktose:true,Polyoler:true,GOS:true},
 skanSom:true, strict:false, kassal:true, clearArm:false,
 custom:null, lesText:"Ingredienser: hvetemel, vann, rapsolje, sukker, gjær, salt, løkpulver, naturlig aroma, emulgator (E471).",
 sheet:null, inputBar:""
};

/* ---------- icons ---------- */
const P = (d,w=22,sw=2)=>`<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
 hist:P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
 ingr:P('<path d="M4 6h16M4 12h16M4 18h10"/>'),
 scan:P('<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v5M16 8v8"/>',40),
 saved:P('<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'),
 savedFill:`<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>`,
 set:P('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
 search:P('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',18),
 x:P('<path d="M6 6l12 12M18 6 6 18"/>',18),
 back:P('<path d="m15 18-6-6 6-6"/>',20),
 chev:P('<path d="m9 18 6-6-6-6"/>',18),
 check:P('<path d="M5 12l5 5L19 7"/>',18,2.6),
 light:P('<path d="M8 2h8l-1 6H9z"/><path d="M9 8h6v12a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2z"/><path d="M12 13v3"/>',20),
 kbd:P('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/>',20),
 photo:P('<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/>',26,1.8),
 text:P('<path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 9h10M7 12h10M7 15h6"/>',26),
 heart:`<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.8 5 21 8.3 19.5 11.8 17.5 16.4 12 21 12 21z"/></svg>`,
 heartO:P('<path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 18.8 5 21 8.3 19.5 11.8 17.5 16.4 12 21 12 21z"/>',20)
};

/* ---------- rating engine ---------- */
const SEV = {"Lav":0,"Middels":1,"Ikke vurdert":2,"Høy":3};
const COL = {"Lav":["var(--lav)","var(--lavt)","var(--lavb)"],"Middels":["var(--mid)","var(--mid)","var(--midb)"],"Høy":["var(--hoy)","var(--hoyt)","var(--hoyb)"],"Ikke vurdert":["var(--gra)","var(--grat)","var(--grab)"]};
const worst = a => a.reduce((w,r)=> SEV[r]>SEV[w]?r:w, "Lav");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const byName = {}; ROWS.forEach(r=>byName[r.n]=r);
const TERMS = [];
ROWS.forEach(r=>{[r.n,...r.s].forEach(t=>{const k=t.toLowerCase().trim(); if(k) TERMS.push({t:k,r});});});
TERMS.sort((a,b)=>b.t.length-a.t.length);
const WC = /[a-z0-9æøåéèäöüàá]/;
const norm = s => s.toLowerCase().replace(/\s+-\s+/g,"").replace(/\be\s+(\d{3,4}[a-z]?)\b/g,"e$1").replace(/\s+/g," ").trim();
function groupsOf(f){const g=[];const l=f.toLowerCase();if(l.includes("fruktan"))g.push("Fruktaner");if(l.includes("laktose"))g.push("Laktose");if(l.includes("fruktose"))g.push("Fruktose");if(l.includes("polyol"))g.push("Polyoler");if(f.includes("GOS"))g.push("GOS");return g;}
function eff(row){let r=row.r;if(r==="Lav"||r==="Ikke vurdert")return r;const g=groupsOf(row.f);if(g.length&&!g.some(x=>S.triggers[x]))return "Lav";if(S.strict&&r==="Middels")return "Høy";return r;}
function match(name,lf){
  let s=" "+norm(name)+" "; const found=[];
  for(const {t,r} of TERMS){
    let i=s.indexOf(t);
    while(i>-1){
      if(!WC.test(s[i-1]||" ")&&!WC.test(s[i+t.length]||" ")){ if(!found.includes(r))found.push(r); s=s.slice(0,i)+" ".repeat(t.length)+s.slice(i+t.length); }
      i=s.indexOf(t,i+1);
    }
  }
  if(!found.length&&/\be\d{3,4}[a-z]?\b/.test(s)) found.push(byName["andre E-nummer"]);
  const l=name.toLowerCase();
  if(lf||/laktosefri|laktoseredusert/.test(l)) return found.map(r=> (r.f==="Laktose"&&r.c==="Melk og meieri")?byName["laktosefrie meieriprodukter"]:r);
  return found;
}
function parse(str){
  let s=str.replace(/^\s*ingredienser\s*:/i,"");
  const cut=s.search(/kan inneholde spor/i); if(cut>-1)s=s.slice(0,cut);
  {let d=0;for(let i=0;i<s.length;i++){const ch=s[i];if(ch==="(")d++;else if(ch===")")d--;else if(ch==="."&&d===0&&/^\.\s+[A-ZÆØÅ]/.test(s.slice(i,i+3))){s=s.slice(0,i);break;}}}
  s=s.replace(/\.\s*$/,"");
  const out=[];let depth=0,buf="";
  const push=()=>{const t=buf.trim();if(t)out.push(node(t));buf="";};
  for(const ch of s){
    if(ch==="("){depth++;buf+=ch;}else if(ch===")"){depth--;buf+=ch;}
    else if((ch===","||ch===";")&&depth===0)push(); else buf+=ch;
  }
  push(); return out;
}
function node(t){
  let name="",kids=[],depth=0,inner="",pct="";
  for(const ch of t){
    if(ch==="("){ if(depth>0)inner+=ch; depth++; }
    else if(ch===")"){ depth--; if(depth>0)inner+=ch; else { const k=inner.trim(); if(/^[\d.,\s]+%$/.test(k))pct=k.replace(/\s/g,""); else kids.push(...parse(k)); inner=""; } }
    else if(depth>0) inner+=ch; else name+=ch;
  }
  name=name.trim();
  return {name, pct, kids};
}
function rate(n,lf){
  n.kids.forEach(k=>rate(k,lf));
  const rows=match(n.name,lf); n.rows=rows;
  const own=rows.length?worst(rows.map(eff)):null;
  const generic=rows.length&&rows.every(r=>r.r==="Ikke vurdert");
  if(n.kids.length){
    const kr=n.kids.map(k=>k.rating);
    if(own!==null&&!generic) n.rating=worst([own,...kr.filter(r=>r==="Høy")]);
    else { n.rating=worst(kr); n.ignoredOwn=true; }
  } else n.rating= own===null?"Ikke vurdert":own;
  n.unknown=!rows.length&&!n.kids.length;
  return n;
}
function analyse(text,lf){
  const tree=parse(text).map(n=>rate(n,lf));
  const why=[];const seen=new Set();
  const walk=n=>{
    if(n.unknown){ if(!seen.has("?"+n.name)){seen.add("?"+n.name);why.push({unknown:n.name});} }
    else if(!n.ignoredOwn) n.rows.forEach(r=>{const e=eff(r); if(e!=="Lav"&&!seen.has(r.n)){seen.add(r.n);why.push({row:r,e,label:n.name});}});
    (!n.ignoredOwn&&n.rows.length? n.kids.filter(k=>k.rating==="Høy") : n.kids).forEach(walk);
  };
  tree.forEach(walk);
  why.sort((a,b)=>SEV[b.e||"Ikke vurdert"]-SEV[a.e||"Ikke vurdert"]);
  const overall=tree.length?worst(tree.map(n=>n.rating)):"Ikke vurdert";
  const counts={"Høy":0,"Middels":0,"Ikke vurdert":0,"Lav":0}; tree.forEach(n=>counts[n.rating]++);
  return {tree,why,overall,counts};
}
const prod = id => PRODUCTS.find(p=>p.id===id);
const isLF = p => !!(p.lf||/laktosefri|laktoseredusert/i.test(p.name||""));
const pRate = p => p.id==="custom"? p.a : analyse(p.ing,isLF(p));
/* purple heart: every counted ingredient is "Ja" or "Nøytral", at least one "Ja", nothing unknown */
function gentleState(a){
  let ja=false, bad=false;
  const walk=n=>{ if(n.unknown){bad=true;return;} if(!n.ignoredOwn) n.rows.forEach(r=>{ if(r.k==="Ja")ja=true; else if(r.k!=="Nøytral")bad=true; }); n.kids.forEach(walk); };
  a.tree.forEach(walk);
  return bad?"Nei":(ja?"Ja":"Nøytral");
}
const pHeart = p => { if(!S.skanSom) return false; const a=pRate(p); return a.overall==="Lav" && gentleState(a)==="Ja"; };
function ingK(i){ if(i.p){ const pp=prod(i.p), a=pRate(pp); return a.overall==="Lav"?gentleState(a):"Nei"; } return byName[i.r].k; }
const NO_HEART_CATS = ["Godteri","Kaker","Snacks"];
const rHeart = r => { if(!S.skanSom||r.noHeart||NO_HEART_CATS.includes(r.cat)||recRating(r)!=="Lav") return false; const ks=r.ing.map(ingK); return ks.every(k=>k!=="Nei") && ks.includes("Ja"); };
function recIngRating(i){ let r= i.p? pRate(prod(i.p)).overall : eff(byName[i.r]); if(i.ok&&r==="Middels") r="Lav"; return r; }
const recRating = r => worst(r.ing.map(recIngRating));

/* ---------- drawn images (original illustrations, no photos) ---------- */
const ART = (()=>{
  const rnd = s => { let x = 0; for (const c of s) x = (x*31 + c.charCodeAt(0)) >>> 0; return () => { x = (x*1103515245 + 12345) >>> 0; return (x % 1000) / 1000; }; };
  const ex = (t,i)=> (t.split(":")[1]) || i;
  const txt = (s,n) => s.length>n ? s.slice(0,n-1)+"…" : s;
  function pack(p){
    const a=p.c1, b=p.c2, br=esc(p.brand), nm=esc(txt(p.name,16));

const heart = () => `<span class="heart" role="img" aria-label="Skånsom">${I.heart}</span>`;
const pimg = (p,s=48) => p.id==="custom"? `<span class="img" style="width:${s}px;height:${s}px;background:#2A2E33;color:#C9CDD2">${I.text}</span>` : `<span class="img" role="img" aria-label="Illustrasjon av ${esc(p.brand+" "+p.name)}" style="width:${s}px;height:${s}px;overflow:hidden;border-radius:${Math.round(s/4)}px">${ART.pack(p)}</span>`;
const rimg = (r,h,rad=12) => `<span class="img" role="img" aria-label="Illustrasjon av ${esc(r.title)}" style="height:${h}px;width:100%;overflow:hidden;border-radius:${rad}px">${ART.dish(r)}</span>`;
const countLine = c => ["Høy","Middels","Ikke vurdert","Lav"].filter(k=>c[k]).map(k=>c[k]+" "+({"Høy":"høy","Middels":"middels","Ikke vurdert":"ikke vurdert","Lav":"lav"}[k])).join(" · ");
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove("show"),1600);}

function prodRow(p,sub){
  const a=pRate(p);
  return `<button class="item card" style="padding:10px 12px" data-act="openP" data-arg="${p.id}">${pimg(p)}
   <span class="col g4 grow" style="gap:1px"><span class="brand">${esc(p.brand)}</span><span style="font-size:15px;font-weight:700">${esc(p.name)}</span><span class="sub">${esc(sub||p.size)}</span></span>
   <span class="row g6">${pHeart(p)?heart():""}${tag(a.overall,true)}</span></button>`;
}

const V = {};
V.historikk = () => {
  const q=S.histQ.toLowerCase();
  const items=S.history.map((h,i)=>({...h,i,p:prod(h.pid)||S.custom,r:null})).filter(h=>h.p);
  items.forEach(h=>h.r=pRate(h.p).overall);
  const f=items.filter(h=>(!q||(h.p.name+" "+h.p.brand).toLowerCase().includes(q)) && (S.histF==="alle"||(S.histF==="heart"?pHeart(h.p):h.r===S.histF)));
  const days=[...new Set(f.map(h=>h.day))];
  const chip=(k,l,st="")=>`<button class="chip ${S.histF===k?"on":""}" style="${st}" data-act="histF" data-arg="${k}" aria-pressed="${S.histF===k}">${l}</button>`;
  return `<div class="col g14"><h1>Historikk</h1>
  <label class="search">${I.search}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Søk i historikken</span><input id="histQ" value="${esc(S.histQ)}" placeholder="Søk i historikken"></label>

      ? `<button class="item card" style="padding:10px 12px" data-act="openCustom"><span class="img" style="width:48px;height:48px;background:#2A2E33;color:#C9CDD2">${I.text}</span><span class="col grow" style="gap:1px"><span class="brand">FRA DITT BILDE</span><span style="font-size:15px;font-weight:700">Din vare</span><span class="sub">${h.time}</span></span>${tag(h.r,true)}</button>`

function whyBlock(a){
  const hi=a.why.filter(w=>w.e==="Høy").map(w=>w.row.n);
  let sum;
  if(a.overall==="Høy") sum=`${esc(hi.slice(0,2).map(x=>x[0].toUpperCase()+x.slice(1)).join(" og "))} gjør denne varen høy.${hi.some(x=>/løk|hvitløk/.test(x))?" Med løk eller hvitløk finnes det <b>ingen porsjon av varen</b> som regnes som trygg.":""}`;
  else if(a.overall==="Ikke vurdert") sum="Noen ingredienser kan ikke vurderes sikkert. Grått regnes aldri som trygt.";
  else if(a.overall==="Middels") sum="Lav bare i små porsjoner. Se mengdene under.";
  else sum="Alle ingrediensene er lave i vanlige porsjoner.";
  return `<div class="lbl" style="color:#B5A8A5">${a.overall==="Lav"?"Hvorfor lav?":"Hvorfor "+word(a.overall,true).toLowerCase()+"?"}</div>
  <div style="padding:12px 14px;border-radius:16px;background:${COL[a.overall][2]};font-size:14px;line-height:1.45">${sum}</div>
  ${a.why.length?`<div class="card list" style="background:none;border-color:#2E2321">${a.why.map(w=> w.unknown
    ? `<div class="row g12" style="padding:12px 14px;align-items:flex-start">${dot("Ikke vurdert")}<span class="col g4"><span style="font-size:15px;font-weight:700">${esc(w.unknown)} <span style="font-weight:500;color:#B5A8A5">· ukjent</span></span><span style="font-size:13px;color:#D6C9C6">Finnes ikke i ingredienslista. Appen gjetter ikke – derfor grå.</span></span></div>`
    : `<button class="item" style="padding:12px 14px;align-items:flex-start" data-act="openRow" data-arg="${esc(w.row.n)}">${dot(w.e)}<span class="col g4 grow"><span style="font-size:15px;font-weight:700">${esc(w.row.n[0].toUpperCase()+w.row.n.slice(1))} <span style="font-weight:500;color:#B5A8A5">· ${esc(w.row.f==="Varierer"?"ikke vurdert":w.row.f.toLowerCase())}</span></span><span style="font-size:13px;color:#D6C9C6;line-height:1.4">${w.row.ok?`<b style="color:var(--lavt)">OK:</b> ${esc(w.row.ok)}. `:""}${esc(w.row.note||"")}</span><span class="sub">Fant: «${esc(w.label)}»</span></span></button>`).join("")}</div>`:""}
  <span class="sub" style="line-height:1.4">Kilde: Haukeland universitetssjukehus (NKFM, juni 2026) og Monash University. Generelle råd – magen din kan tåle mer eller mindre.</span>`;
}
function chipsFor(a){
  const flat=[...a.tree].sort((x,y)=>SEV[y.rating]-SEV[x.rating]);
  return `<div class="chips" style="gap:6px">${flat.map(n=>{const r=n.rating;const row=(n.rows&&n.rows[0]);return `<button class="ing" ${row&&!n.ignoredOwn?`data-act="openRow" data-arg="${esc(row.n)}"`:"disabled"} style="background:${COL[r][2]};color:${COL[r][1]};${SEV[r]===3?"font-weight:700":""}">${esc(n.name.toLowerCase())}</button>`}).join("")}</div>`;
}

    ${isLF(p)&&p.id!=="custom"?`<span class="sub" style="margin-top:-4px">Varen er merket laktosefri, så melk i ingredienslisten regnes som laktosefri.</span>`:""}

  return `<div class="col g14"><h1>Slå opp</h1>${tabs}
   <label class="search">${I.search}<span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Hva har du lyst på?</span><input id="recQ" value="${esc(S.recQ)}" placeholder="Hva har du lyst på? F.eks. pannekaker"></label>
   <div class="hs" role="group" aria-label="Kategori">${RCATS.map(c=>`<button class="chip ${S.recCat===c?"on":""}" aria-pressed="${S.recCat===c}" data-act="recCat" data-arg="${c}">${c}</button>`).join("")}</div>
   <div id="recOut">${recOut()}</div></div>`;
};
function lookOut(){
  const q=S.lookQ.trim().toLowerCase();
  if(!q) return `<div class="empty">Søk etter en ingrediens (f.eks. «inulin», «E420») eller en vare (f.eks. «semper»).</div>`;
  const rows=ROWS.filter(r=>r.n.toLowerCase().includes(q)||r.s.some(s=>s.toLowerCase().includes(q)))
    .sort((a,b)=>(a.n.toLowerCase().startsWith(q)?0:1)-(b.n.toLowerCase().startsWith(q)?0:1)||a.n.localeCompare(b.n,"nb"));
  const ps=PRODUCTS.filter(p=>(p.brand+" "+p.name+" "+p.cat).toLowerCase().includes(q)||(q.length>=3&&p.ing.toLowerCase().includes(q)));
  const f=S.lookFilter;
  const ch=(k,l)=>`<button class="chip ${f===k?"on":""}" aria-pressed="${f===k}" data-act="lookF" data-arg="${k}">${l}</button>`;
  return `<div class="chips">${ch("alt","Alt")}${ch("ing","Ingredienser · "+rows.length)}${ch("var","Varer · "+ps.length)}</div>
  ${f!=="var"?`<div class="col g6"><span class="lbl">Ingredienser</span>${rows.length?`<div class="card list">${rows.slice(0,f==="ing"?40:5).map(r=>{const e=eff(r);const hit=r.n.toLowerCase().includes(q)?"":r.s.find(s=>s.toLowerCase().includes(q));return `<button class="item" data-act="openRow" data-arg="${esc(r.n)}">${dot(e)}<span class="col grow" style="gap:1px"><span style="font-size:15px;font-weight:700">${esc(r.n[0].toUpperCase()+r.n.slice(1))}</span><span class="sub">${hit?"Også kalt «"+esc(hit)+"»":esc(r.ok?"OK: "+r.ok:(r.f==="Ingen"?"Ingen FODMAP":r.f))}</span></span>${tag(e)}</button>`}).join("")}</div>${f==="alt"&&rows.length>5?`<button class="chip" data-act="lookF" data-arg="ing" style="align-self:flex-start">Vis alle ${rows.length}</button>`:""}`:`<div class="card empty">Ingen ingrediens heter «${esc(S.lookQ)}». En ingrediens appen ikke kjenner blir grå.</div>`}</div>`:""}
  ${f!=="ing"?`<div class="col g6"><div class="row sb"><span class="lbl">Varer</span><span class="sub">fra Open Food Facts</span></div>${ps.length?ps.map(p=>{const a=pRate(p);return prodRow(p,p.size+" · "+(a.overall==="Lav"?"alle "+a.tree.length+" ingredienser lave":countLine(a.counts)))}).join(""):`<div class="card empty">Ingen varer i demoen matcher. I appen søkes det i hele Open Food Facts.</div>`}</div>`:""}`;
}
function recOut(){
  const q=S.recQ.trim().toLowerCase();
  const rs=RECIPES.filter(r=>(S.recCat==="Alle"||r.cat===S.recCat)&&(!q||(r.title+" "+r.cat+" "+r.ing.map(i=>i.t).join(" ")).toLowerCase().includes(q)));
  if(!rs.length) return `<div class="empty">${q?`Ingen oppskrifter på «${esc(S.recQ)}» i demoen ennå.`:`Ingen oppskrifter i «${esc(S.recCat)}» i demoen ennå.`}</div>`;
  return `<div class="col g8"><span class="lbl">${q?"Treff":"Populært"}</span><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">${rs.map(r=>{const rr=recRating(r);return `<button class="card col g8" data-act="openR" data-arg="${r.id}" style="padding:10px;text-align:left;cursor:pointer;color:var(--ink)">${rimg(r,80)}<span class="col" style="gap:1px"><span style="font-size:15px;font-weight:700;line-height:1.2">${esc(r.title)}</span><span class="sub">${r.cat} · ${r.time}</span></span><span class="row g6">${pill(rr,true)}${rHeart(r)?heart():""}</span></button>`}).join("")}</div></div>`;
}

V.row = () => {
  const r=byName[S.row]; const e=eff(r);
  const alts=(r.b||[]).map(n=>byName[n]).filter(Boolean);
  const scanned=S.history.map(h=>prod(h.pid)).filter(p=>p&&match(p.ing).length&&analyse(p.ing).tree.some(function f(n){return (n.rows||[]).includes(r)||n.kids.some(f)}));
  return `<div class="col g14"><button class="back" data-act="back">${I.back}Tilbake</button>
  <div class="row sb g12" style="align-items:flex-start"><div class="col g4"><h1 style="font-size:30px">${esc(r.n[0].toUpperCase()+r.n.slice(1))}</h1><span style="font-size:14px;color:#B8BEC4">${esc(r.f==="Ingen"?"Ingen FODMAP":r.f)} · ${esc(r.c.toLowerCase())}</span></div>${pill(e)}</div>
  ${e!==r.r?`<span class="sub">Vurdert som ${r.r.toLowerCase()} i lista, men endret av innstillingene dine.</span>`:""}
  ${r.note?`<div style="padding:14px;border-radius:18px;background:${COL[e][2]};display:flex;flex-direction:column;gap:6px"><span class="lbl" style="color:#B5A8A5">Hvorfor?</span><span style="font-size:14px;line-height:1.45">${esc(r.note)}</span></div>`:""}
  ${r.s.length?`<div class="col g8"><span class="lbl">Andre navn på etiketten</span><div class="chips" style="gap:6px">${r.s.map(s=>`<span class="ing" style="background:#1B1F23;border:1px solid #2A2E33;cursor:default">${esc(s)}</span>`).join("")}</div></div>`:""}
  ${alts.length?`<div class="col g8"><span class="lbl">Bytt ut med</span><div class="chips" style="gap:6px">${alts.map(x=>{const xe=eff(x);return `<button class="ing" data-act="openRow" data-arg="${esc(x.n)}" style="background:${COL[xe][2]};color:${COL[xe][1]};font-weight:700">${esc(x.n)}${x.ok&&xe!=="Lav"?" · "+esc(x.ok):""}</button>`}).join("")}</div></div>`:""}
  <div class="card list"><div class="row g12" style="padding:12px 14px"><span class="sub grow" style="font-size:14px">OK mengde</span><span style="font-size:14px;font-weight:600">${esc(r.ok||(e==="Lav"?"Vanlig porsjon":"Ingen oppgitt"))}</span></div>
   <div class="row g12" style="padding:12px 14px"><span class="sub grow" style="font-size:14px">Varer du har skannet med dette</span><span style="font-size:14px;font-weight:600">${scanned.length}</span></div>
   <div class="row g12" style="padding:12px 14px"><span class="sub grow" style="font-size:14px">Skånsom for magen</span><span class="row g6" style="font-size:14px;font-weight:600">${r.k==="Ja"?heart()+" Ja":r.k}</span></div>
   <div class="row g12" style="padding:12px 14px"><span class="sub grow" style="font-size:14px">Kilde</span><span style="font-size:14px;font-weight:600;text-align:right">${esc(r.src)}</span></div></div></div>`;
};

V.opp = () => {
  const r=RECIPES.find(x=>x.id===S.rid); const rr=recRating(r); const saved=S.saved.r.includes(r.id);
  return `<div class="col g16"><div class="row sb"><button class="back" data-act="back">${I.back}Oppskrifter</button><button class="icb" aria-label="${saved?"Fjern fra lagret":"Lagre oppskrift"}" aria-pressed="${saved}" data-act="saveR" data-arg="${r.id}" style="${saved?"color:var(--acc)":""}">${saved?I.savedFill:I.saved}</button></div>
  ${rimg(r,180,22)}
  <div class="col g6"><h1 style="font-size:28px">${esc(r.title)}</h1><span style="font-size:14px;color:#B8BEC4">${r.cat} · ${r.time} · ${r.yield}</span></div>
  <div class="row g10" style="padding:10px 12px;border-radius:16px;background:${COL[rr][2]}">${pill(rr,true," FODMAP")}<span style="font-size:13px;color:#C9D6CE">${rr==="Lav"?`Alle ${r.ing.length} ingredienser er lave`:"Se ingrediensene under"}</span>${rHeart(r)?heart():""}</div>
  <div class="lbl">Ingredienser og hva du kan kjøpe</div>
  <div class="col g10">${r.ing.map(i=>{const ir=recIngRating(i);const p=i.p&&prod(i.p);const row=i.r&&byName[i.r];return `<div class="card col g8" style="padding:12px"><div class="row g10">${dot(ir)}<span style="font-size:16px;font-weight:700" class="grow">${esc(i.t)}</span>${row?`<button class="ing" data-act="openRow" data-arg="${esc(row.n)}" style="background:none;color:var(--mute);padding:4px 0">${I.chev}</button>`:""}</div>
   ${p?`<button class="item" data-act="openP" data-arg="${p.id}" style="padding:8px;border-radius:12px;background:#1B1F23">${pimg(p,40)}<span class="col grow" style="gap:1px"><span class="brand">${esc(p.brand)}</span><span style="font-size:14px;font-weight:600">${esc(p.name)}, ${esc(p.size)}</span></span>${tag(pRate(p).overall,true)}</button>`:""}
   ${i.warn?`<span class="sub" style="color:#B8BEC4;line-height:1.4">${esc(i.warn)}</span>`:""}</div>`}).join("")}</div>
  <div class="lbl">Slik gjør du</div>
  <ol style="margin:0;padding:0;list-style:none" class="col g12">${r.steps.map((s,k)=>`<li class="step"><span class="num">${k+1}</span><span style="font-size:15px;line-height:1.45;color:#E2E5E8">${esc(s)}</span></li>`).join("")}</ol>
  ${r.serve.length||r.avoid.length?`<div class="lbl">Server med</div><div class="chips" style="gap:6px">${r.serve.map(s=>`<span class="ing" style="background:var(--lavb);color:var(--lavt);font-weight:700;cursor:default">${esc(s)}</span>`).join("")}${r.avoid.map(s=>`<span class="ing" style="background:var(--hoyb);color:var(--hoyt);font-weight:700;cursor:default">ikke ${esc(s)}</span>`).join("")}</div>`:""}
  ${r.tip?`<span class="sub" style="line-height:1.4;font-size:13px">${esc(r.tip)}</span>`:""}
  <span class="sub" style="line-height:1.45">${esc(r.src)} Ingrediensene er vurdert etter Haukeland (NKFM) og Monash.</span></div>`;
};

/* ---------- sheets (bottom panels) ---------- */
function sheetHtml(){
  if(S.sheet==="sim") return `<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-label="Simuler skann"><span class="lbl">Simuler skann</span>
   ${PRODUCTS.map(p=>`<button class="item card" style="padding:10px 12px" data-act="doScan" data-arg="${p.id}">${pimg(p,40)}<span class="col grow" style="gap:1px"><span class="brand">${esc(p.brand)}</span><span style="font-size:15px;font-weight:700">${esc(p.name)}</span></span>${I.chev}</button>`).join("")}
   <button class="item card" style="padding:10px 12px" data-act="doScan" data-arg="ukjent"><span class="img" style="width:40px;height:40px;background:#23272B;color:var(--ink);font-weight:700">?</span><span class="col grow" style="gap:1px"><span class="brand">UKJENT</span><span style="font-size:15px;font-weight:700">Vare som mangler data</span></span>${I.chev}</button>
   <button class="big ghost" data-act="closeSheet">Avbryt</button></div>`;
  if(S.sheet==="ean") return `<div class="scrim" data-act="closeSheet"></div><form class="sheet" id="eanForm" role="dialog" aria-label="Skriv inn strekkode"><label class="col g8"><span class="lbl">Skriv inn strekkode</span><span class="search"><input id="eanIn" inputmode="numeric" placeholder="f.eks. 7032069740125" autocomplete="off"></span></label><span class="sub">Prøv 7032069740125 eller 7310100565983.</span><button class="big light" type="submit">Søk</button><button class="big ghost" type="button" data-act="closeSheet">Avbryt</button></form>`;
  return "";
}

/* ---------- render ---------- */
const TOP = {historikk:"hist",slaa:"ingr",row:"ingr",opp:"ingr",skanner:"scan",vare:"scan",ingendata:"scan",les:"scan",lagret:"saved",innst:"set",kilder:"set"};
function render(keepScroll){
  const v=document.getElementById("view"); const st=v.scrollTop;
  v.innerHTML=V[S.view]();
  if(!keepScroll) v.scrollTop=0; else v.scrollTop=st;
  const t=TOP[S.view];
  const b=(k,l,go)=>`<button class="${t===k?"on":""}" aria-label="${l}" ${t===k?'aria-current="page"':""} data-act="tab" data-arg="${go}">${I[k]}</button>`;
  document.getElementById("nav").innerHTML=b("hist","Historikk","historikk")+b("ingr","Slå opp","slaa")+`<button class="scan" aria-label="Skann" ${t==="scan"?'aria-current="page"':""} data-act="tab" data-arg="skanner">${I.scan}</button>`+b("saved","Lagret","lagret")+b("set","Innstillinger","innst");
  document.getElementById("layer").innerHTML=sheetHtml();
  if(S.sheet==="ean"){const i=document.getElementById("eanIn");i&&i.focus();}
}
function go(view,push=true){ if(push&&S.view!==view) S.stack.push({view:S.view,pid:S.pid,rid:S.rid,row:S.row}); S.view=view; S.clearArm=false; render(); }
function back(){ const p=S.stack.pop(); if(!p){go("historikk",false);return;} Object.assign(S,p); render(); }
function addHistory(pid){ S.history=S.history.filter(h=>!(h.pid===pid&&h.day==="I dag")); const d=new Date(); S.history.unshift({pid,day:"I dag",time:String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}); }

const app=document.getElementById("app");
app.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]"); if(!el||el.disabled) return;
  const a=el.dataset.act, g=el.dataset.arg;
  switch(a){
    case "tab": S.stack=[]; S.sheet=null; go(g,false); break;
    case "go": go(g); break;
    case "back": back(); break;
    case "openP": S.pid=g; go("vare"); break;
    case "openCustom": S.pid="custom"; go("vare"); break;
    case "openR": S.rid=g; go("opp"); break;
    case "openRow": S.row=g; go("row"); break;
    case "histF": S.histF=g; render(true); break;
    case "lookTab": S.lookTab=g; render(true); break;
    case "lookF": S.lookFilter=g; document.getElementById("lookOut").innerHTML=lookOut(); break;
    case "recCat": S.recCat=g; render(true); break;
    case "saveP": { const i=S.saved.p.indexOf(g); if(i>-1){S.saved.p.splice(i,1);toast("Fjernet fra lagret");} else {S.saved.p.unshift(g);toast("Lagret");} render(true); break; }
    case "saveR": { const i=S.saved.r.indexOf(g); if(i>-1){S.saved.r.splice(i,1);toast("Fjernet fra lagret");} else {S.saved.r.unshift(g);toast("Lagret");} render(true); break; }
    case "trig": S.triggers[g]=!S.triggers[g]; render(true); break;
    case "sw": S[g]=!S[g]; if(g==="skanSom"&&!S.skanSom&&S.histF==="heart")S.histF="alle"; render(true); break;
    case "clear": if(S.clearArm){S.history=[];S.clearArm=false;toast("Historikken er tømt");render(true);} else {S.clearArm=true;render(true);} break;
    case "sheet": S.sheet=g; render(true); break;
    case "closeSheet": S.sheet=null; render(true); break;
    case "doScan": S.sheet=null; S.inputBar=""; if(g==="ukjent"){go("ingendata");} else {addHistory(g); S.pid=g; go("vare");} break;
    case "useLes": { const ar=analyse(S.lesText); S.custom={id:"custom",brand:"FRA DITT BILDE",name:"Din vare",size:ar.tree.length+" ingredienser lest",ean:"",cat:"",src:"Ditt bilde av ingredienslisten",ing:S.lesText,a:ar}; S.history=S.history.filter(h=>h.pid!=="custom"); addHistory("custom"); S.pid="custom"; go("vare"); break; }
    case "toast": toast(g); break;
  }
});
app.addEventListener("input",ev=>{
  const id=ev.target.id;
  if(id==="histQ"){S.histQ=ev.target.value; const v=document.createElement("div"); v.innerHTML=V.historikk(); document.getElementById("histList").innerHTML=v.querySelector("#histList").innerHTML;}
  if(id==="lookQ"){S.lookQ=ev.target.value; S.lookFilter="alt"; document.getElementById("lookOut").innerHTML=lookOut();}
  if(id==="recQ"){S.recQ=ev.target.value; document.getElementById("recOut").innerHTML=recOut();}
  if(id==="lesText"){S.lesText=ev.target.value; document.getElementById("lesOut").innerHTML=lesOut(analyse(S.lesText));}
});
app.addEventListener("submit",ev=>{
  if(ev.target.id!=="eanForm") return; ev.preventDefault();
  const v=document.getElementById("eanIn").value.replace(/\D/g,""); S.sheet=null;
  const p=PRODUCTS.find(x=>x.ean&&x.ean===v);
  if(p){addHistory(p.id);S.pid=p.id;go("vare");} else {S.inputBar=v;go("ingendata");}
});
render();
}
</script>
</body>
</html>
